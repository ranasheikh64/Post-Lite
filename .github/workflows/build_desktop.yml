name: Build Desktop Releases (macOS, Windows, Linux)

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ==========================================
  # 1. Build macOS (.dmg & .zip)
  # ==========================================
  build_macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build macOS Release
        run: flutter build macos --release

      - name: Package macOS App (.dmg & .zip)
        run: |
          cd build/macos/Build/Products/Release
          APP_ORIG=$(find . -maxdepth 1 -name "*.app" -print -quit)
          echo "Found application: $APP_ORIG"
          if [ "$APP_ORIG" != "./Jronix Post.app" ] && [ -e "$APP_ORIG" ]; then
            mv "$APP_ORIG" "./Jronix Post.app"
          fi
          
          # Clear any extended quarantine attributes and ad-hoc sign
          xattr -cr "Jronix Post.app" || true
          codesign --force --deep --sign - "Jronix Post.app" || true
          
          # Create DMG and ZIP
          hdiutil create -volname "Jronix Post" -srcfolder "Jronix Post.app" -ov -format UDZO Jronix-Post-macOS.dmg
          zip -r Jronix-Post-macOS.zip "Jronix Post.app"
          mv Jronix-Post-macOS.dmg "${{ github.workspace }}/"
          mv Jronix-Post-macOS.zip "${{ github.workspace }}/"

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            Jronix-Post-macOS.dmg
            Jronix-Post-macOS.zip
          retention-days: 2

  # ==========================================
  # 2. Build Windows (.exe setup & .zip)
  # ==========================================
  build_windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Package Windows App (Setup Wizard .exe & .zip)
        shell: pwsh
        run: |
          choco install innosetup -y
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue)?.Source
          if (-not $iscc -or -not (Test-Path $iscc)) {
            $iscc = (Get-ChildItem -Path "C:\Program Files*", "C:\Inno*" -Recurse -Filter "ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName)
          }
          if (-not $iscc) {
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          Write-Host "Inno Setup compiler located at: $iscc"
          New-Item -ItemType Directory -Force -Path "build\windows\installer"
          & "$iscc" windows\installer\jronix_post_setup.iss
          if (Test-Path "build\windows\installer\Jronix-Post-Windows-Setup.exe") {
            Move-Item -Path "build\windows\installer\Jronix-Post-Windows-Setup.exe" -Destination "${{ github.workspace }}\Jronix-Post-Windows-Setup.exe"
          } else {
            Write-Error "Installer .exe was not generated"
            exit 1
          }
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "Jronix-Post-Windows-x64.zip"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            Jronix-Post-Windows-Setup.exe
            Jronix-Post-Windows-x64.zip
          retention-days: 2

  # ==========================================
  # 3. Build Linux (.tar.gz)
  # ==========================================
  build_linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Linux Release
        run: flutter build linux --release

      - name: Package Linux App (.tar.gz)
        run: |
          printf "[Desktop Entry]\nName=Jronix Post\nComment=Next-gen API, Socket.IO & WebSocket Client\nExec=./jronixpost\nIcon=jronixpost\nTerminal=false\nType=Application\nCategories=Development;\n" > build/linux/x64/release/bundle/jronixpost.desktop
          cp assets/icons/main_logo.png build/linux/x64/release/bundle/jronixpost.png
          chmod +x build/linux/x64/release/bundle/jronixpost || true
          tar -czvf Jronix-Post-Linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: Jronix-Post-Linux-x64.tar.gz
          retention-days: 2

  # ==========================================
  # 4. Create / Update GitHub Release
  # ==========================================
  publish_release:
    name: Publish Release Assets
    needs: [build_macos, build_windows, build_linux]
    if: always() && (needs.build_macos.result == 'success' || needs.build_windows.result == 'success' || needs.build_linux.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Determine Release Tag
        id: tag_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          if [ -z "$TAG" ]; then
            TAG="v1.0.0"
          fi
          echo "release_tag=$TAG" >> $GITHUB_OUTPUT

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.release_tag }}
          name: "Jronix Post ${{ steps.tag_info.outputs.release_tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            release-assets/Jronix-Post-macOS.dmg
            release-assets/Jronix-Post-macOS.zip
            release-assets/Jronix-Post-Windows-Setup.exe
            release-assets/Jronix-Post-Windows-x64.zip
            release-assets/Jronix-Post-Linux-x64.tar.gz

      - name: Trigger Email Notification Broadcast to All Users
        if: success()
        env:
          BACKEND_URL: "https://post-lite-backend.vercel.app"
          BROADCAST_SECRET: ${{ secrets.BROADCAST_SECRET || secrets.JWT_SECRET }}
        run: |
          echo "Broadcasting update notification to registered users..."
          curl -s -X POST "$BACKEND_URL/updates/broadcast" \
            -H "Content-Type: application/json" \
            -H "x-broadcast-secret: $BROADCAST_SECRET" \
            -d '{
              "version": "${{ steps.tag_info.outputs.release_tag }}",
              "landingPageUrl": "https://jronix-post.vercel.app/#download"
            }' || echo "Broadcast API call completed"
